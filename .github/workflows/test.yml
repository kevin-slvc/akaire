name: test

# CONTRIBUTING.md の「npm test を通す」を、push と PR のたびに機械でやる。
# 静的チェックはブラウザ不要、それ以外は Playwright の Chromium で実走する。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
