<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>large DOM fixture</title>
<!-- v1.34: DIVが数千個あるページで、枠・切り取りの保存が固まらないことの確認用。
     v1.33までは保存1回で照合が候補数×本文全体の計算になり、実際のダッシュボード（DIV約1.7万）で数分止まった -->
<style>body{font-family:sans-serif;margin:24px} .card{border:1px solid #ccc;margin:4px;padding:4px} .card .row{padding:2px}</style>
</head>
<body>
<h1>大きいページ</h1>
<div id="wrap"></div>
<script>
(function(){
  var html = [];
  for (var i = 0; i < 1500; i++) {
    html.push('<div class="card"><div class="row">カード' + i + 'の見出し</div><div class="row">本文' + i + '。数字 ' + (i * 37) + '</div><div class="row"><span>補足' + i + '</span></div></div>');
  }
  document.getElementById('wrap').innerHTML = html.join('');
})();
</script>
<script src="../../rv-layer.js" data-rv-default="on"></script>
</body>
</html>
